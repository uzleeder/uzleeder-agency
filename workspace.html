<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Workspace · AGI / UzLeeder</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<script>try{var t=localStorage.getItem("uz_ws_theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* ---- semantic tokens (same names as the public site's V5 tokens) ---- */
:root{
  --background:#07090d;--surface:#0e1219;--surface-elevated:#151a24;--surface-hover:#1a2030;
  --text:#eef1f6;--text-muted:#9aa3b5;--text-faint:#6b7488;
  --brand:#e01e37;--brand-hover:#f0384e;--brand-soft:rgba(224,30,55,.14);
  --border:#232a38;--border-strong:#323b4d;
  --success:#22c38e;--warning:#f0b429;--error:#ff5a6a;--info:#5aa7ff;
  --radius:12px;--mono:'Cascadia Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[data-theme="light"]{
  --background:#f7f8fa;--surface:#ffffff;--surface-elevated:#ffffff;--surface-hover:#f0f2f6;
  --text:#1c2233;--text-muted:#5b6478;--text-faint:#8a92a4;
  --brand:#e01e37;--brand-hover:#c4142b;--brand-soft:rgba(224,30,55,.09);
  --border:#e3e6ec;--border-strong:#cfd4de;
  --success:#0f9d6c;--warning:#b7791f;--error:#d42a3c;--info:#2f6fd0;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--background);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand-hover);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand svg{width:30px;height:28px}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand span{display:block;font:600 10px/1 var(--mono);letter-spacing:.22em;color:var(--brand-hover);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:1px;flex:1}
.nav .g{font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;color:var(--text-muted);text-align:start}
.nav button:hover{background:var(--surface-hover);color:var(--text)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--text)}
.nav button[aria-current="page"] .ico{color:var(--brand-hover)}
.nav .sub{padding-inline-start:36px}
.nav .count{margin-inline-start:auto;font:600 11px/1 var(--mono);background:var(--brand);color:#fff;border-radius:99px;padding:3px 7px}
.side-foot{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.side-foot a,.side-foot button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--text-muted);text-decoration:none;font-size:13px}
.side-foot a:hover,.side-foot button:hover{background:var(--surface-hover);color:var(--text)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--background) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.menu-btn{display:none}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text-muted)}
.search:hover{border-color:var(--border-strong)}
.search kbd,.kbd{margin-inline-start:auto;font:600 11px/1 var(--mono);border:1px solid var(--border-strong);border-radius:6px;padding:3px 6px;color:var(--text-faint)}
.era-tag{font:700 11px/1 var(--mono);letter-spacing:.2em;color:var(--brand-hover);white-space:nowrap}
.content{padding:24px;max-width:1280px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:24px;letter-spacing:-.01em}
.head p{margin:4px 0 0;color:var(--text-muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---- components ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface-elevated);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--text-faint)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.danger{color:var(--error)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card h2,.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h2 .k,.card h3 .k{margin-inline-start:auto;font:500 12px/1 var(--sans);color:var(--text-faint)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat b{display:block;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.stat span{color:var(--text-muted);font-size:12.5px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:8px;border-bottom:1px solid var(--border);text-align:start;width:100%}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--surface-hover)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;color:var(--text-muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--text-muted)}.faint{color:var(--text-faint)}.mono{font-family:var(--mono);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);letter-spacing:.04em;padding:4px 8px;border-radius:99px;border:1px solid var(--border-strong);color:var(--text-muted);white-space:nowrap;text-transform:uppercase}
.pill.ok{color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent)}
.pill.warn{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.pill.err{color:var(--error);border-color:color-mix(in srgb,var(--error) 45%,transparent)}
.pill.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
.pill.brand{color:var(--brand-hover);border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.empty{padding:28px 16px;text-align:center;color:var(--text-muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.req{border:1px dashed var(--border-strong);border-radius:var(--radius);padding:18px;background:var(--surface)}
.req b{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.req code{font-family:var(--mono);font-size:12px;background:var(--surface-hover);padding:2px 6px;border-radius:5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--border)}
.tabs button{padding:8px 12px;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600;font-size:13px}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--brand)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--text-muted)}
.input,select.input,textarea.input{width:100%;background:var(--background);border:1px solid var(--border-strong);border-radius:9px;padding:9px 11px;outline:0}
.input:focus{border-color:var(--brand-hover)}
textarea.input{min-height:110px;resize:vertical}
.hint{font-size:12px;color:var(--text-faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-hover)}
.tbl{overflow-x:auto}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kcol{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-height:160px}
.kcol h3{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between}
.task{background:var(--surface-elevated);border:1px solid var(--border);border-radius:9px;padding:10px;margin-bottom:8px}
.task b{display:block;font-weight:600;margin-bottom:4px}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text-muted)}
.dest{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;background:var(--surface-elevated)}
.dest input{width:18px;height:18px;accent-color:var(--brand)}
.dest .t{flex:1;min-width:0}
.dest .t b{display:block}
.dest .t span{font-size:12px;color:var(--text-muted)}
.deliv{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.deliv:last-child{border-bottom:0}
.deliv .st{width:22px;text-align:center;font-weight:700}
.deliv .t{flex:1;min-width:0}
.deliv .t span{display:block;font-size:12px;color:var(--text-muted);word-break:break-word}
.s-sent{color:var(--success)}.s-failed{color:var(--error)}.s-unknown{color:var(--warning)}.s-sending{color:var(--info)}.s-not_sent,.s-cancelled{color:var(--text-faint)}
.summary{font-weight:700;font-size:15px;margin:4px 0 10px}
.split{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.preview-media img,.preview-media video{max-width:100%;max-height:360px;border-radius:9px;display:block;background:#000}
.tgpreview{background:var(--surface-hover);border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.act{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border)}
.act time{font:12px var(--mono);color:var(--text-faint);white-space:nowrap;min-width:110px}
.act .ty{font:600 11px var(--mono);color:var(--text-faint);min-width:130px}
.bar{height:6px;background:var(--surface-hover);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.thread{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{max-width:85%;padding:8px 11px;border-radius:12px;background:var(--surface-hover);white-space:pre-wrap;word-break:break-word}
.msg.out{align-self:flex-end;background:var(--brand-soft)}
.msg small{display:block;color:var(--text-faint);font-size:11px;margin-top:3px}
pre.log{background:#05070a;color:#c9d1e0;border-radius:9px;padding:12px;max-height:420px;overflow:auto;font:12px/1.45 var(--mono);white-space:pre-wrap}

/* ---- dialogs, drawer, palette, toasts ---- */
dialog{border:1px solid var(--border-strong);border-radius:14px;background:var(--surface);color:var(--text);padding:0;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(3,5,8,.62)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.dlg-h h2{margin:0;font-size:16px;flex:1}
.dlg-b{padding:16px 18px;overflow:auto;max-height:calc(100vh - 190px)}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(560px,100vw);border-radius:0;border-width:0 0 0 1px}
[dir="rtl"] dialog.drawer{margin:0 auto 0 0}
dialog.drawer .dlg-b{max-height:calc(100vh - 120px)}
.pal{width:min(640px,calc(100vw - 24px));margin-top:10vh}
.pal input{width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;padding:16px 18px;font-size:16px;outline:0}
.pal ul{list-style:none;margin:0;padding:6px;max-height:55vh;overflow:auto}
.pal li button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;text-align:start}
.pal li button[aria-selected="true"],.pal li button:hover{background:var(--brand-soft)}
.pal li .k{margin-inline-start:auto;font:11px var(--mono);color:var(--text-faint)}
.pal .grp{font:600 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);padding:10px 12px 4px}
.toasts{position:fixed;inset-inline-end:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface-elevated);border:1px solid var(--border-strong);border-inline-start:3px solid var(--success);border-radius:10px;padding:10px 14px;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.err{border-inline-start-color:var(--error)}.toast.info{border-inline-start-color:var(--info)}
.up{position:fixed;inset-inline-start:50%;transform:translateX(-50%);bottom:16px;z-index:99;background:var(--surface-elevated);border:1px solid var(--border-strong);border-radius:10px;padding:10px 14px;width:min(360px,90vw)}
.up .bar{margin-top:6px}

/* ---- login ---- */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{width:min(380px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px}
.login h1{margin:14px 0 4px;font-size:20px}
.login p{margin:0 0 18px;color:var(--text-muted)}
.login .era{font:700 11px/1 var(--mono);letter-spacing:.24em;color:var(--brand-hover)}
.err-text{color:var(--error);font-size:13px;min-height:18px;margin:6px 0}

/* ---- responsive ---- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:50;transform:translateX(-100%);transition:transform .2s ease}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(3,5,8,.55)}
  .menu-btn{display:inline-flex}
  .top{padding:10px 16px}
  .content{padding:16px}
  .g2,.g3,.kanban,.two{grid-template-columns:1fr}
  .era-tag{display:none}
  .search kbd{display:none}
  .hide-m{display:none}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.head h1{font-size:20px}.act{flex-wrap:wrap}.act .ty{min-width:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* V5 additions: 4-column board, media library, diff, project signature */
.kanban.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.kanban.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.kanban.k4{grid-template-columns:1fr}}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.lib-item{display:flex;flex-direction:column;gap:4px;text-align:start;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface);min-width:0}
.lib-item b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-item:focus-visible,.lib-item:hover{border-color:var(--brand)}
.lib-th{display:grid;place-items:center;aspect-ratio:4/3;border-radius:6px;background:var(--surface-2,rgba(127,127,127,.08));overflow:hidden;color:var(--muted)}
.lib-th img{width:100%;height:100%;object-fit:cover}
.diff span{display:block;white-space:pre-wrap}.diff .da{background:rgba(34,197,94,.14)}.diff .dd{background:rgba(229,36,59,.14)}
.sig-card{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:22px 16px;border:1px solid var(--border);border-radius:12px;font-size:13px;line-height:1.5}
.sig-brand{letter-spacing:.3em;font-size:12px}.sig-label{font-size:18px;letter-spacing:.06em;color:var(--brand)}
.sig-line{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.14em;color:var(--muted)}
.sig-id{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.14em;color:var(--muted)}.sig-id b{color:var(--text);font-size:13px}
.sig-era{font-size:11px;letter-spacing:.3em;font-weight:700}
</style>

<div id="root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<dialog id="drawer" class="drawer" aria-labelledby="drawerTitle"></dialog>
<dialog id="pal" class="pal" aria-label="Command palette">
  <input id="palIn" type="text" placeholder="Search projects, requests, files… or type a command" aria-label="Command or search" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palList"/>
  <ul id="palList" role="listbox"></ul>
</dialog>

<script>
"use strict";
/* ======================= core ======================= */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ico = (n, cls) => '<svg class="ico' + (cls ? " " + cls : "") + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : n > 1024 ? Math.round(n / 1024) + " KB" : (n || 0) + " B";
const when = iso => { if (!iso) return ""; const d = new Date(iso); return d.toLocaleDateString(undefined, { day: "2-digit", month: "short" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); };
const rid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
const S = { token: sessionStorage.getItem("uz_ws_token") || "", view: "home", param: null, data: {} };

async function api(action, params) {
  const r = await fetch("/api/workspace", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + S.token }, body: JSON.stringify(Object.assign({ action }, params || {})) });
  if (r.status === 401) { signOut(true); throw new Error("Session expired"); }
  const j = await r.json().catch(() => ({ ok: false, error: "Bad response (" + r.status + ")" }));
  if (!j.ok) throw new Error(j.error || "Request failed");
  return j;
}
async function apiRaw(action, params) {
  const r = await fetch("/api/workspace", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + S.token }, body: JSON.stringify(Object.assign({ action }, params || {})) });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || "Download failed"); }
  return r.blob();
}
function toast(msg, kind) {
  const t = document.createElement("div"); t.className = "toast " + (kind || ""); t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), kind === "err" ? 7000 : 4000);
}
const fail = e => toast(e.message || String(e), "err");
function signOut(expired) {
  S.token = ""; sessionStorage.removeItem("uz_ws_token");
  renderLogin(expired ? "Your session ended — sign in again." : "");
}

/* ======================= login ======================= */
function renderLogin(msg) {
  $("#root").innerHTML = '<div class="login"><form id="loginForm" autocomplete="on">' +
    '<svg width="40" height="37" style="color:var(--text)" aria-hidden="true"><use href="#mark"/></svg>' +
    '<p class="era" style="margin-top:14px">SALAAM NEW ERA.</p><h1>AGI / UzLeeder Workspace</h1><p>Private operating environment. Same password as the Control Center.</p>' +
    '<div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" autocomplete="current-password" required minlength="6"/></div>' +
    '<p class="err-text" id="loginErr" role="alert">' + esc(msg || "") + '</p>' +
    '<button class="btn primary" style="width:100%" type="submit">' + ico("lock") + 'Sign in</button></form></div>';
  $("#pw").focus();
  $("#loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const b = $("#loginForm button"); b.disabled = true;
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }) });
      const j = await r.json().catch(() => ({}));
      if (!j.ok) throw new Error(j.error || "Sign-in failed");
      S.token = j.token; sessionStorage.setItem("uz_ws_token", j.token);
      boot();
    } catch (err) { $("#loginErr").textContent = err.message; b.disabled = false; }
  });
}

/* ======================= shell ======================= */
const NAV = [
  { k: "home", t: "Command Center", i: "home" },
  { k: "partners", t: "Partners", i: "user" },
  { g: "Business" }, { k: "requests", t: "Requests", i: "inbox" }, { k: "clients", t: "Clients", i: "user" }, { k: "projects", t: "Projects", i: "folder" }, { k: "startups", t: "Startups", i: "rocket" }, { k: "portfolio", t: "Portfolio", i: "check" },
  { g: "Production" }, { k: "files", t: "Files", i: "file" }, { k: "websites", t: "Websites", i: "globe" }, { k: "development", t: "Development", i: "code" }, { k: "deployments", t: "Deployments", i: "rocket" },
  { g: "Media" }, { k: "studio", t: "Content Studio", i: "pen" }, { k: "library", t: "Media library", i: "file" }, { k: "telegram", t: "Telegram", i: "send" }, { k: "youtube", t: "YouTube", i: "play" },
  { g: "Work" }, { k: "tasks", t: "Tasks", i: "check" }, { k: "activity", t: "Activity", i: "list" }
];
const TITLE = Object.fromEntries(NAV.filter(n => n.k).map(n => [n.k, n.t]));
function shell() {
  $("#root").innerHTML = '<div class="app"><aside class="side" id="side" aria-label="Workspace navigation">' +
    '<div class="brand"><svg aria-hidden="true" style="color:var(--text)"><use href="#mark"/></svg><div><b>Workspace</b><span>AGI · UZLEEDER</span></div></div>' +
    '<nav class="nav" id="nav"></nav>' +
    '<div class="side-foot"><a href="/admin" target="_blank" rel="noopener">' + ico("lock") + 'Control Center (Admin)' + ico("out") + '</a><a href="/" target="_blank" rel="noopener">' + ico("globe") + 'Public site</a>' +
    '<button type="button" id="themeBtn">' + ico("moon") + 'Theme</button><button type="button" id="outBtn">' + ico("x") + 'Sign out</button></div></aside>' +
    '<div class="main"><header class="top"><button class="btn sm menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="side" aria-expanded="false">' + ico("menu") + '</button>' +
    '<button class="search" type="button" id="searchBtn" aria-label="Search and commands (Ctrl+K)">' + ico("search") + '<span>Search or run a command…</span><kbd>Ctrl K</kbd></button>' +
    '<span class="era-tag">SALAAM NEW ERA.</span></header><main class="content" id="view" tabindex="-1"></main></div></div>';
  $("#menuBtn").onclick = () => { const o = $("#side").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); };
  $("#side").addEventListener("click", e => { if (e.target === $("#side")) $("#side").classList.remove("open"); });
  $("#searchBtn").onclick = () => openPalette();
  $("#outBtn").onclick = () => signOut();
  $("#themeBtn").onclick = () => { const t = document.documentElement.dataset.theme === "light" ? "dark" : "light"; document.documentElement.dataset.theme = t; try { localStorage.setItem("uz_ws_theme", t); } catch (e) {} };
  renderNav();
}
function renderNav() {
  const badge = { requests: S.data.openRequests || 0 };
  $("#nav").innerHTML = NAV.map(n => n.g ? '<div class="g">' + esc(n.g) + '</div>' :
    '<button type="button" data-go="' + n.k + '"' + (S.view === n.k ? ' aria-current="page"' : "") + '>' + ico(n.i) + '<span>' + esc(n.t) + '</span>' + (badge[n.k] ? '<span class="count">' + badge[n.k] + '</span>' : "") + '</button>').join("");
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.dataset.go, g.dataset.param || null); $("#side") && $("#side").classList.remove("open"); }
});
function go(view, param) {
  S.view = view; S.param = param;
  const hash = "#" + view + (param ? "/" + param : "");
  if (location.hash !== hash) history.replaceState(null, "", hash);
  renderNav();
  document.title = (TITLE[view] || "Workspace") + " · AGI / UzLeeder Workspace";
  const v = $("#view"); v.innerHTML = '<p class="muted">Loading…</p>';
  (VIEWS[view] || VIEWS.home)(v, param).catch(e => { v.innerHTML = '<div class="req"><b>Could not load this page</b><p class="muted">' + esc(e.message) + '</p></div>'; });
  v.focus({ preventScroll: true }); window.scrollTo(0, 0);
}
const head = (title, sub, actions) => '<div class="head"><div><h1>' + esc(title) + '</h1>' + (sub ? '<p>' + sub + '</p>' : "") + '</div><div class="actions">' + (actions || "") + '</div></div>';
const integrationRequired = (name, envs, extra) => '<div class="req"><b>' + ico("lock") + 'Integration required — ' + esc(name) + '</b><p class="muted">Nothing is shown here until the real integration is connected. Add these keys to <code>.env</code> and run <code>npm run setup</code> (or add them in Vercel → Settings → Environment Variables), then redeploy:</p><p>' + envs.map(k => '<code>' + k + '</code>').join(" ") + '</p>' + (extra || "") + '</div>';
const emptyBox = (t, d) => '<div class="empty"><b>' + esc(t) + '</b>' + esc(d || "") + '</div>';

/* ======================= dialogs ======================= */
function dialog(title, bodyHTML, buttons, opts) {
  const d = opts && opts.drawer ? $("#drawer") : $("#dlg");
  const id = d.id === "drawer" ? "drawerTitle" : "dlgTitle";
  d.innerHTML = '<div class="dlg-h"><h2 id="' + id + '">' + esc(title) + '</h2><button class="btn sm" type="button" data-close aria-label="Close">' + ico("x") + '</button></div><div class="dlg-b">' + bodyHTML + '</div>' + (buttons ? '<div class="dlg-f">' + buttons + '</div>' : "");
  $("[data-close]", d).onclick = () => d.close();
  if (!d.open) d.showModal();
  return d;
}
function confirmBox(title, html, okLabel, danger) {
  return new Promise(res => {
    const d = dialog(title, html, '<button class="btn" type="button" data-no>Cancel</button><button class="btn ' + (danger ? "danger" : "primary") + '" type="button" data-yes>' + esc(okLabel || "Confirm") + '</button>');
    const done = v => { d.close(); res(v); };
    $("[data-no]", d).onclick = () => done(false);
    $("[data-yes]", d).onclick = () => done(true);
    d.addEventListener("cancel", () => res(false), { once: true });
    $("[data-yes]", d).focus();
  });
}
function formDialog(title, fields, values, onSave, opts) {
  values = values || {};
  const html = fields.map(f => {
    const v = values[f.k] == null ? (f.def || "") : values[f.k];
    const id = "f_" + f.k;
    const input = f.type === "select" ? '<select class="input" id="' + id + '" name="' + f.k + '">' + f.options.map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? " selected" : "") + '>' + esc(o[1]) + '</option>').join("") + '</select>'
      : f.type === "textarea" ? '<textarea class="input" id="' + id + '" name="' + f.k + '">' + esc(v) + '</textarea>'
      : '<input class="input" id="' + id + '" name="' + f.k + '" type="' + (f.type || "text") + '" value="' + esc(v) + '"' + (f.req ? " required" : "") + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : "") + '/>';
    return '<div class="field"><label for="' + id + '">' + esc(f.label) + (f.req ? " *" : "") + '</label>' + input + (f.hint ? '<span class="hint">' + esc(f.hint) + '</span>' : "") + '</div>';
  }).join("");
  const d = dialog(title, '<form id="fd">' + html + '</form>', (opts && opts.extraBtn || "") + '<button class="btn" type="button" data-close2>Cancel</button><button class="btn primary" type="submit" form="fd">' + esc((opts && opts.saveLabel) || "Save") + '</button>');
  $("[data-close2]", d).onclick = () => d.close();
  const first = $("input,select,textarea", d); if (first) first.focus();
  $("#fd").addEventListener("submit", async e => {
    e.preventDefault();
    const out = {}; fields.forEach(f => { out[f.k] = $("#f_" + f.k).value; });
    const b = $('button[type="submit"]', d); b.disabled = true;
    try { await onSave(out); d.close(); } catch (err) { fail(err); b.disabled = false; }
  });
  return d;
}

/* ======================= shared data ======================= */
async function projectsList(force) { if (force || !S.data.projects) S.data.projects = (await api("projects.list")).projects; return S.data.projects; }
async function clientsList(force) { if (force || !S.data.clients) S.data.clients = (await api("clients.list")).clients; return S.data.clients; }
const projName = id => { const p = (S.data.projects || []).find(x => x.id === id); return p ? p.name : ""; };
const projOptions = () => [["", "— none —"]].concat((S.data.projects || []).map(p => [p.id, p.name]));
// request status (V5) — CONVERTED is set by "Create project", not chosen by hand
const STAGES = [["new", "NEW"], ["reviewing", "REVIEWING"], ["qualified", "QUALIFIED"], ["waiting", "WAITING FOR CLIENT"], ["converted", "CONVERTED"], ["declined", "DECLINED"], ["archived", "ARCHIVED"]];
const STAGE_LABEL = Object.fromEntries(STAGES);
const OPEN_STAGES = ["new", "reviewing", "qualified", "waiting"];
const stagePill = s => '<span class="pill ' + ({ new: "brand", reviewing: "info", qualified: "info", waiting: "warn", converted: "ok", declined: "", archived: "" })[s] + '">' + esc(STAGE_LABEL[s] || s) + '</span>';
const PSTATUS = ["PLANNING", "ACTIVE", "IN_REVIEW", "WAITING_FOR_CLIENT", "READY_FOR_DELIVERY", "COMPLETED", "ARCHIVED"];
const pstatusPill = s => '<span class="pill ' + ({ ACTIVE: "brand", IN_REVIEW: "info", WAITING_FOR_CLIENT: "warn", READY_FOR_DELIVERY: "info", COMPLETED: "ok", ARCHIVED: "" })[s] + '">' + esc(String(s || "").replace(/_/g, " ")) + '</span>';
const PKIND = [["client", "Client project"], ["product", "UzLeeder product"], ["demo", "Demonstration"], ["internal", "Internal"]];
const SERVICE = { website: "Website", system: "Business system", ai: "AI / automation", academy: "Academy", design: "Design", existing: "Existing project", other: "Other" };
const SERVICE_OPTS = Object.entries(SERVICE);
const BUDGET = { lt500: "Under $500", "500-1500": "$500–1,500", "1500-4000": "$1,500–4,000", gt4000: "$4,000+", unsure: "Not sure" };
const TIMELINE = { asap: "As soon as possible", "1m": "Within a month", "1-3m": "1–3 months", flexible: "Flexible" };
const TSTATUS = [["todo", "To do"], ["in_progress", "In progress"], ["review", "Review"], ["done", "Done"]];
const TSTATUS_LABEL = Object.fromEntries(TSTATUS);
const SOURCE = { website: "Website brief", telegram_bot: "Services bot", workspace: "Added manually" };

/* ======================= views ======================= */
const VIEWS = {};
VIEWS.partners = async v => window.PartnerUI.mount(v, { token: S.token, mode: "workspace" });

VIEWS.home = async v => {
  const now = new Date(), today = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  const o = await api("overview", { today });
  S.data.openRequests = o.requests.open; renderNav();
  const h = now.getHours(), greet = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";   // browser's local time
  const stat = (go, n, label, alert) => '<button class="card stat" type="button" data-go="' + go + '" style="text-align:start"><b' + (alert && n ? ' style="color:var(--error)"' : "") + '>' + n + '</b><span>' + label + '</span></button>';
  const qa = (cmd, icon, label) => '<button class="btn" type="button" data-cmd="' + cmd + '">' + ico(icon) + label + '</button>';
  v.innerHTML = '<div class="head"><div><h1>' + greet + ', Max.</h1><p>Here\'s what needs your attention — real records only, no sample data.</p></div></div>' +
    '<div class="actions" style="margin-bottom:16px" aria-label="Quick actions">' + qa("newProject", "plus", "New project") + qa("newRequest", "plus", "New request") + qa("uploadFile", "up", "Upload file") + qa("createContent", "pen", "Create content") + qa("newTask", "check", "New task") + qa("openWebsite", "globe", "Open website") + '</div>' +
    '<div class="grid g4" style="margin-bottom:14px">' +
    stat("projects", o.projects.active.length, "active projects") + stat("requests", o.requests.new, "new requests") + stat("tasks", o.tasks.due, "tasks due today or overdue", true) + stat("files", o.files.attention.length, "files waiting") +
    stat("studio", o.content.drafts.length, "drafts") + stat("studio", o.content.ready.length, "ready to publish") + stat("deployments", o.deployments.configured && o.deployments.latest ? o.deployments.latest.length : "—", o.deployments.configured ? "recent deployments" : "deployments · not configured") + stat("studio", o.failedOps, "failed operations", true) + '</div>' +
    '<div class="grid g2">' +
    '<section class="card"><h2>' + ico("inbox") + 'Requests<span class="k">website + services bot</span></h2>' + (o.requests.latest.length ? '<div class="list">' + o.requests.latest.map(r => '<button class="row" type="button" data-go="requests" data-param="' + r.id + '"><span class="t"><b>' + esc(r.name || "Request") + (r.code ? ' <span class="faint mono" style="font-weight:400">' + esc(r.code) + '</span>' : "") + '</b><span>' + esc(SERVICE[r.service] || r.service || "") + ' · ' + esc(String(r.message || "").slice(0, 80)) + '</span></span>' + stagePill(r.stage) + '</button>').join("") + '</div>' : emptyBox("No open requests", "New briefs from the website and the services bot appear here.")) + '</section>' +
    '<section class="card"><h2>' + ico("folder") + 'Active projects</h2>' + (o.projects.active.length ? '<div class="list">' + o.projects.active.map(p => '<button class="row" type="button" data-go="projects" data-param="' + p.id + '"><span class="t"><b>' + esc(p.name) + '</b><span>' + (p.due ? "Due " + esc(p.due) : "No due date") + '</span></span>' + pstatusPill(p.status) + '</button>').join("") + '</div>' : emptyBox("No projects yet", "Create one from a request or with “New project”.")) + '</section>' +
    '<section class="card"><h2>' + ico("send") + 'Publishing</h2>' + (o.content.failures.length ? o.content.failures.map(c => '<button class="row" type="button" data-go="studio" data-param="' + c.id + '"><span class="t"><b>' + esc(c.title || "Untitled") + '</b><span>' + c.delivery.sent + ' of ' + c.delivery.total + ' destinations succeeded' + (c.delivery.unknown ? " · " + c.delivery.unknown + " unconfirmed" : "") + '</span></span><span class="pill err">Attention</span></button>').join("") : "") +
      o.content.ready.map(c => '<button class="row" type="button" data-go="studio" data-param="' + c.id + '"><span class="t"><b>' + esc(c.title || "Untitled") + '</b><span>Reviewed — waiting to be sent</span></span><span class="pill info">READY</span></button>').join("") +
      o.content.drafts.map(c => '<button class="row" type="button" data-go="studio" data-param="' + c.id + '"><span class="t"><b>' + esc(c.title || "Untitled") + '</b><span>Draft</span></span><span class="pill">DRAFT</span></button>').join("") +
      (!o.content.failures.length && !o.content.drafts.length && !o.content.ready.length ? emptyBox("Nothing waiting", "Drafts, ready posts and failed deliveries appear here.") : "") + '</section>' +
    '<section class="card"><h2>' + ico("rocket") + 'Deployments</h2>' + (!o.deployments.configured ? '<p class="muted">Integration required — connect Vercel (VERCEL_TOKEN) to see real deployments.</p>' : o.deployments.error ? '<p class="s-failed">' + esc(o.deployments.error) + '</p>' : '<div class="list">' + o.deployments.latest.map(d => '<div class="row"><span class="t"><b>' + esc(d.commit || d.url) + '</b><span>' + esc(d.target) + ' · ' + when(d.at) + '</span></span>' + deployPill(d.state) + '</div>').join("") + '</div>') + '</section>' +
    '<section class="card"><h2>' + ico("file") + 'Files needing attention</h2>' + (o.files.attention.length ? o.files.attention.map(f => '<button class="row" type="button" data-go="files" data-param="' + f.id + '"><span class="t"><b>' + esc(f.name) + '</b><span>' + esc(f.note) + '</span></span></button>').join("") : emptyBox("None flagged", o.files.total + " files in the workspace.")) + '</section>' +
    '<section class="card"><h2>' + ico("list") + 'Recent activity<span class="k"><button class="btn sm" type="button" data-go="activity">All</button></span></h2>' + actList(o.activity) + '</section></div>' +
    (o.portfolio.waiting ? '<p style="margin-top:14px"><button class="btn sm" type="button" data-go="portfolio">' + ico("check") + o.portfolio.waiting + ' portfolio entr' + (o.portfolio.waiting === 1 ? "y" : "ies") + ' waiting for review</button></p>' : "") +
    '<section class="card" style="margin-top:14px"><h2>Integrations<span class="k"><button class="btn sm" type="button" id="intCheck">Check connections</button></span></h2><div class="actions" id="intBox">' + intChips(o.integrations) + '</div><p class="hint" id="intAt">Configured keys only. “Check connections” asks each service for real.</p></section>';
  $("#intCheck").onclick = async e => { e.target.disabled = true; e.target.textContent = "Checking…"; try { const j = await api("integrations.check"); $("#intBox").innerHTML = intChips(null, j.integrations); $("#intAt").textContent = "Checked " + when(j.checkedAt) + "."; } catch (err) { fail(err); } e.target.disabled = false; e.target.textContent = "Check connections"; };
};
const INT_NAMES = { storage: "Storage", telegram: "Telegram publishing", servicesBot: "Services bot", github: "GitHub", vercel: "Vercel deployments", youtube: "YouTube" };
const INT_STATE = { connected: ["ok", "● Connected"], not_configured: ["", "○ Not configured"], expired: ["warn", "▲ Expired / refused"], error: ["err", "✕ Error"], configured: ["info", "◐ Configured — not checked"] };
function intChips(flags, checked) {
  const list = checked || { storage: { state: flags.storage ? "connected" : "not_configured" }, telegram: { state: flags.telegram ? "configured" : "not_configured" }, github: { state: flags.github ? "configured" : "not_configured" }, vercel: { state: flags.vercel ? "configured" : "not_configured" }, youtube: { state: flags.youtube ? "configured" : "not_configured" } };
  return Object.keys(list).map(k => { const s = INT_STATE[list[k].state] || INT_STATE.error; return '<span class="pill ' + s[0] + '" title="' + esc(list[k].error || list[k].detail || "") + '">' + esc(INT_NAMES[k] || k) + ' · ' + s[1] + (list[k].detail ? " · " + esc(list[k].detail) : "") + '</span>'; }).join("");
}const deployPill = s => '<span class="pill ' + ({ success: "ok", failed: "err", building: "info", queued: "", cancelled: "warn" })[s] + '">' + esc(s || "unknown") + '</span>';
const actList = list => list && list.length ? '<div class="list">' + list.map(a => '<div class="act"><time datetime="' + esc(a.at) + '">' + when(a.at) + '</time><span>' + esc(a.text) + '</span></div>').join("") + '</div>' : emptyBox("No activity yet", "Real actions are recorded here as they happen.");

/* ---------- requests ---------- */
VIEWS.requests = async (v, param) => {
  const [{ requests }] = await Promise.all([api("requests.list"), projectsList()]);
  S.data.requests = requests;
  S.data.openRequests = requests.filter(r => ["new", "reviewing"].includes(r.stage)).length; renderNav();
  const filter = S.reqFilter || "open";
  const shown = requests.filter(r => filter === "all" ? true : filter === "open" ? OPEN_STAGES.includes(r.stage) : r.stage === filter);

/* ---------- digital project signature ----------
   PROJECT COMPLETED only when the project really is COMPLETED; DEMONSTRATION for demos; READY FOR DEPLOYMENT for deployable products.
   It is UzLeeder's own delivery mark, not a certification. */
function signatureOf(p) {
  if (p.kind === "demo" && ["READY_FOR_DELIVERY", "COMPLETED"].includes(p.status)) return { label: "DEMONSTRATION", line: "BUILT • REVIEWED" };
  if (p.kind === "product" && p.status === "READY_FOR_DELIVERY") return { label: "READY FOR DEPLOYMENT", line: "BUILT • REVIEWED • READY" };
  if (p.status === "COMPLETED") return { label: "PROJECT COMPLETED", line: "BUILT • REVIEWED • DELIVERED" };
  return null;
}
function signatureCard(p) {
  const s = signatureOf(p);

    '<div class="sig-card" role="img" aria-label="' + esc(s.label + " — project " + (p.code || "")) + '"><svg width="30" height="28" aria-hidden="true" style="color:var(--text)"><use href="#mark"/></svg>' +
    '<b class="sig-brand">UZLEEDER</b><b class="sig-label">' + s.label + '</b><span>Built by Max<br/>Founder &amp; CEO</span><span class="sig-line">' + s.line + '</span>' +

}

  while (i < m && j < n) { if (A[i] === B[j]) { out.push([" ", A[i]]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) out.push(["-", A[i++]]); else out.push(["+", B[j++]]); }

    } catch (e) { out.innerHTML = '<p class="s-failed">' + esc(e.message) + '</p>'; }
  };

}

// Draft → validate → select → preview → confirm → send → verify → persist → activity
async function sendFlow(c, only) {
  const targets = (only || c.destinations || []).filter(h => { const s = ((c.pubs || {})[h] || {}).state || "not_sent"; return !["sent", "sending", "unknown"].includes(s); });
  if (!targets.length) { toast(c.destinations && c.destinations.length ? "Every selected destination already has a result. Nothing to send." : "Select at least one verified Telegram destination.", "info"); go("studio", c.id); return; }
  const max = c.media ? 1024 : 4096;
  if ((c.text || "").length > max) { toast("The text is longer than Telegram allows (" + max + ").", "err"); return; }
  if (!c.media && !(c.text || "").trim()) { toast("Write the text first.", "err"); return; }
  const idem = rid();                                     // one confirmation = one send id; a double click cannot send twice
  const d = dialog(only ? "Retry failed destinations" : "Send to Telegram",
    '<p class="lbl">Preview</p>' + (c.media ? '<p class="muted">' + ico("file") + ' ' + esc(c.media.name) + ' (' + esc(c.media.kind) + ')</p>' : "") + '<div class="tgpreview">' + (esc(c.text) || '<span class="faint">(no text)</span>') + '</div>' +
    '<p class="lbl" style="margin-top:14px">Will be sent now to ' + targets.length + ' destination(s)</p><div class="actions">' + targets.map(h => '<span class="pill brand">' + esc(h) + '</span>').join("") + '</div>' +
    ((c.destinations || []).length > targets.length ? '<p class="hint" style="margin-top:8px">Destinations that already succeeded are not sent again.</p>' : "") +
    '<div id="sendRes" aria-live="polite"></div>',
    '<button class="btn" type="button" id="sNo">Cancel</button><button class="btn primary" type="button" id="sGo">' + ico("send") + 'Send now</button>');
  $("#sNo", d).onclick = () => d.close();
  $("#sGo", d).onclick = async () => {
    const b = $("#sGo", d); b.disabled = true; b.textContent = "Sending…"; $("#sNo", d).disabled = true;
    try {
      const j = await api("content.send", { id: c.id, idem, confirm: true, only: only || undefined });
      const x = j.content;
      $("#sendRes", d).innerHTML = '<p class="summary" style="margin-top:14px">' + (j.duplicate ? "Already processed — nothing was sent twice. " : "") + x.delivery.sent + ' of ' + x.delivery.total + ' destinations succeeded.</p>' +
        targets.map(h => { const p = x.pubs[h] || { state: "not_sent" }; return '<div class="deliv"><span class="st s-' + p.state + '">' + ST_ICON[p.state] + '</span><span class="t"><b>' + esc(h) + '</b><span>' + (p.state === "sent" ? "Sent successfully · message_id " + p.messageId : esc(p.error || ST_TEXT[p.state])) + '</span></span></div>'; }).join("");
      b.remove(); $("#sNo", d).disabled = false; $("#sNo", d).textContent = "Close";
      $("#sNo", d).onclick = () => { d.close(); go("studio", c.id); };
    } catch (e) {
      $("#sendRes", d).innerHTML = '<p class="s-failed" style="margin-top:14px">✕ ' + esc(e.message) + '</p><p class="hint">The draft is kept. Open it to retry, edit or cancel.</p>';
      b.remove(); $("#sNo", d).disabled = false; $("#sNo", d).textContent = "Close"; $("#sNo", d).onclick = () => { d.close(); go("studio", c.id); };
    }
  };
}

    { k: "service", label: "Service", type: "select", options: SERVICE_OPTS },
    { k: "budget", label: "Budget (optional)" }, { k: "timeline", label: "Timeline (optional)" }, { k: "message", label: "What do they need?", type: "textarea" }
  ], {}, async out => { const j = await api("requests.create", out); toast("Request " + j.request.code + " added."); go("requests", j.request.id); }),
  uploadFile: () => pickAndUpload({ folder: "documents" }, f => go("files", f.id)),

  newTask: () => taskForm(null, "", () => go("tasks")),

  openWebsite: async () => { try { const { websites } = await api("websites.list"); const w = websites.find(x => (x.env || "production") === "production") || websites[0]; if (w) window.open(w.url, "_blank", "noopener"); else go("websites"); } catch (e) { fail(e); } }
};
document.addEventListener("click", e => { const c = e.target.closest("[data-cmd]"); if (c && CMDS[c.dataset.cmd]) CMDS[c.dataset.cmd](); });
const PAL_BASE = [
  { t: "New project", k: "command", run: CMDS.newProject }, { t: "New request", k: "command", run: CMDS.newRequest },
  { t: "Upload file", k: "command", run: CMDS.uploadFile }, { t: "Create content", k: "command", run: CMDS.createContent }, { t: "New task", k: "command", run: CMDS.newTask },
  { t: "Publish content", k: "go", run: () => go("studio") }, { t: "Open requests", k: "go", run: () => go("requests") }, { t: "Open website", k: "command", run: CMDS.openWebsite },
  { t: "Open deployments", k: "go", run: () => go("deployments") }, { t: "Open Telegram", k: "go", run: () => go("telegram") }, { t: "Open YouTube", k: "go", run: () => go("youtube") }
].concat(NAV.filter(n => n.k).map(n => ({ t: "Go to " + n.t, k: "go", run: () => go(n.k) })));
let palItems = [], palSel = 0, palTimer = null, palSeq = 0;
function openPalette(q) {
  const d = $("#pal"); if (!d.open) d.showModal();
  $("#palIn").value = q || ""; palRender(PAL_BASE); $("#palIn").focus();
  if (q) palQuery(q);
}
function palRender(items, results) {
  palItems = items.concat(results || []); palSel = 0;
  const kindGo = { project: "projects", request: "requests", client: "clients", task: "tasks", file: "files", content: "studio", website: "websites", activity: "activity" };
  $("#palList").innerHTML = (items.length ? '<li class="grp" role="presentation">Commands</li>' : "") + items.map((x, i) => '<li role="presentation"><button type="button" role="option" data-pi="' + i + '" aria-selected="' + (i === 0) + '">' + esc(x.t) + '<span class="k">' + esc(x.k) + '</span></button></li>').join("") +
    (results && results.length ? '<li class="grp" role="presentation">Results</li>' + results.map((x, j) => '<li role="presentation"><button type="button" role="option" data-pi="' + (items.length + j) + '" aria-selected="' + (items.length + j === 0) + '">' + esc(x.t) + '<span class="k">' + esc(x.k) + '</span></button></li>').join("") : "") +
    (results && !results.length && !items.length ? '<li class="grp" role="presentation">No matches</li>' : "");
  palItems.forEach(x => { if (x.kind) x.run = () => { const view = x.kind === "activity" ? (kindGo[x.refKind] || "activity") : kindGo[x.kind]; go(view, x.id || null); }; });
  $$("[data-pi]").forEach(b => b.onclick = () => palRun(+b.dataset.pi));
}
function palRun(i) { const x = palItems[i]; if (!x) return; $("#pal").close(); x.run(); }
function palQuery(q) {
  const lc = q.toLowerCase();
  const cmds = PAL_BASE.filter(x => x.t.toLowerCase().includes(lc));
  palRender(cmds);
  clearTimeout(palTimer);
  if (lc.length < 2) return;
  const seq = ++palSeq;
  palTimer = setTimeout(async () => {
    try { const j = await api("search", { q }); if (seq !== palSeq) return; palRender(cmds, j.results.map(r => ({ t: r.title, k: r.kind, kind: r.kind, id: r.id, refKind: r.refKind }))); }
    catch (e) { /* keep commands visible */ }
  }, 220);
}
$("#palIn").addEventListener("input", e => palQuery(e.target.value));
$("#palIn").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); palSel = (palSel + (e.key === "ArrowDown" ? 1 : -1) + palItems.length) % Math.max(1, palItems.length);
    $$("[data-pi]").forEach(b => b.setAttribute("aria-selected", +b.dataset.pi === palSel)); const cur = $('[data-pi="' + palSel + '"]'); cur && cur.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") { e.preventDefault(); palRun(palSel); }
});
$("#pal").addEventListener("click", e => { if (e.target === $("#pal")) $("#pal").close(); });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k" && S.token) { e.preventDefault(); $("#pal").open ? $("#pal").close() : openPalette(); }
});

/* ======================= boot ======================= */
function boot() {
  if (!S.token) return renderLogin();
  shell();
  const [view, param] = location.hash.replace(/^#/, "").split("/");
  go(VIEWS[view] ? view : "home", param || null);
}
window.addEventListener("hashchange", () => { if (!S.token) return; const [view, param] = location.hash.replace(/^#/, "").split("/"); if (VIEWS[view] && (view !== S.view || (param || null) !== S.param)) go(view, param || null); });
