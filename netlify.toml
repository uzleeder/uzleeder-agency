# Netlify — production host for uzleeder.uz, with shared server code:
#   static files: dist/ only (build/netlify-dist.cjs — never api/, server/, build/, archive/ or any .env file)
#   API: netlify/web-functions/* wrap the shared handlers in api/ using the modern Functions runtime
#   storage: Netlify Blobs (api/_lib/blob-netlify.js) — separate from Vercel's data
# Keep routes and headers in step with vercel.json.

[build]
  command = "node build/netlify-dist.cjs"
  publish = "dist"
  functions = "netlify/web-functions"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "@vercel/blob", "pdf-lib", "@pdf-lib/fontkit", "qrcode-generator", "@resvg/resvg-wasm"]
  # read with fs at runtime (certificate PDFs), so they are not found by require-tracing
  # Include installed dependencies explicitly: Windows CLI tracing drops external CJS packages from ESM functions.
  included_files = ["api/**", "node_modules/**"]

# ---------- old addresses ----------
[[redirects]]
  from = "/startups/uzport"
  to = "/startups/t-port"
  status = 301
  force = true

# ---------- API → functions (first match wins, so these come before the catch-all below) ----------
[[redirects]]
  from = "/api/media/*"
  to = "/.netlify/functions/media?key=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/:fn"
  to = "/.netlify/functions/:fn"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true

