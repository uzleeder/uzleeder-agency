  to = "/.netlify/functions/og?page=:slug"
  status = 200
[[redirects]]
  from = "/startups/*"
  to = "/startups.html"
  status = 200

# ---------- headers (as in vercel.json) ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/certs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/workspace*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/partner-workspace.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
