<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="UzLeeder official stamp — For Leaders, Est. 2026">
  <!-- Stamp edition of emblem.svg for documents: no background disc, single red "ink" colour -->
  <defs>
    <path id="st-top" d="M 23,100 A 77,77 0 0 1 177,100" fill="none"/>
    <path id="st-bot" d="M 177,100 A 77,77 0 0 1 23,100" fill="none"/>
  </defs>
  <g fill="none" stroke="#059669">
    <circle cx="100" cy="100" r="97" stroke-width="3"/>
    <circle cx="100" cy="100" r="91" stroke-width="1.4"/>
    <circle cx="100" cy="100" r="72" stroke-width="1.3" stroke-dasharray="0 4.6" stroke-linecap="round"/>
  </g>
  <g fill="#059669">
    <circle cx="28" cy="100" r="2.3"/>
    <circle cx="172" cy="100" r="2.3"/>
  </g>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" fill="#059669">
    <text font-size="12.5" letter-spacing="4.6"><textPath href="#st-top" startOffset="50%" text-anchor="middle">UZLEEDER</textPath></text>
    <text font-size="9" letter-spacing="3.2"><textPath href="#st-bot" startOffset="50%" text-anchor="middle">·FOR·LEADERS·</textPath></text>
    <text x="100" y="137" text-anchor="middle" font-size="9.5" letter-spacing="2">EST. 2026</text>
  </g>
  <!-- peak mark: red outer Λ, ink-black inner Λ (as in the primary logo) -->
  <path d="M74 116 100 66l26 50" fill="none" stroke="#059669" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M85 116 100 84l15 32" fill="none" stroke="#0f2a24" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="100" cy="61" r="4.8" fill="#059669"/>
</svg>
