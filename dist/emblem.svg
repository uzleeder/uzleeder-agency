<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="UzLeeder official emblem — For Leaders, Est. 2026">
  <defs>
    <!-- one clockwise circle for the ring lettering: top half reads left→right, bottom half continues round (as on the seal) -->
    <path id="em-top" d="M 23,100 A 77,77 0 0 1 177,100" fill="none"/>
    <path id="em-bot" d="M 177,100 A 77,77 0 0 1 23,100" fill="none"/>
  </defs>

  <!-- Bold Red edition: ink navy disc (logo colour), red rim, dotted inner ring with two side studs -->
  <circle cx="100" cy="100" r="99" fill="#1c2233"/>
  <circle cx="100" cy="100" r="91" fill="none" stroke="#f0384e" stroke-width="1.8"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#f0384e" stroke-width="1.3" stroke-dasharray="0 4.6" stroke-linecap="round"/>
  <circle cx="28" cy="100" r="2.3" fill="#f0384e"/>
  <circle cx="172" cy="100" r="2.3" fill="#f0384e"/>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" fill="#f0384e">
    <text font-size="12.5" letter-spacing="4.6"><textPath href="#em-top" startOffset="50%" text-anchor="middle">UZLEEDER</textPath></text>
    <text font-size="9" letter-spacing="3.2"><textPath href="#em-bot" startOffset="50%" text-anchor="middle">·FOR·LEADERS·</textPath></text>
  </g>

  <!-- peak mark: red outer stroke, white inner chevron, white summit dot -->
  <path d="M74 116 100 66l26 50" fill="none" stroke="#f0384e" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M85 116 100 84l15 32" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="100" cy="61" r="4.8" fill="#ffffff"/>

  <text x="100" y="137" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="800" letter-spacing="2" fill="#f0384e">EST. 2026</text>
</svg>
