<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#07090d"/>
<title>UzLeeder Control Center</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>
<script>
  // theme before first paint
  (function () { try { var t = localStorage.getItem("uz_admin_theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
</script>
<style>
/* =========================================================
   UzLeeder Control Center — Bold Red
   ========================================================= */
:root{
  --font:'Manrope','Segoe UI',system-ui,sans-serif; --display:'Outfit','Manrope','Segoe UI',sans-serif;
  --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:14px; --r-sm:10px; --side:260px; --ease:cubic-bezier(.2,.7,.2,1);
  --ok:#22c55e; --warn:#f0a82a; --danger:#e5645b; --info:#5aa3e8;
  --color-brand:var(--gold); --color-accent:var(--gold); --color-background:var(--bg); --color-surface:var(--panel);
  --color-text:var(--text); --color-muted:var(--muted); --color-border:var(--line-2);
  --color-success:var(--ok); --color-warning:var(--warn); --color-danger:var(--danger);
}
:root[data-theme="dark"]{
  --bg:#07090d; --bg-2:#0b0e14; --panel:#10141c; --panel-2:#151a24; --panel-3:#1c2230;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --text:#f2f4f8; --muted:#9098a8; --faint:#5d6574;
  --gold:#f0384e; --gold-2:#ff5468; --gold-rgb:240,56,78; --on-gold:#fff; --inner:#fff;
  --shadow:0 24px 60px rgba(0,0,0,.5); color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f7f9; --bg-2:#eef0f4; --panel:#ffffff; --panel-2:#f6f7f9; --panel-3:#e9ecf1;
  --line:rgba(28,34,51,.10); --line-2:rgba(28,34,51,.18);
  --text:#10141f; --muted:#596175; --faint:#8b92a1;
  --gold:#e01e37; --gold-2:#b3122a; --gold-rgb:224,30,55; --on-gold:#fff; --inner:#1c2233;
  --shadow:0 20px 50px rgba(11,31,58,.12); color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-size:14.5px;line-height:1.55;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--gold-2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;flex:none}
.ico{width:18px;height:18px;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:rgba(var(--gold-rgb),.3)}
[hidden]{display:none!important}
.mark{width:30px;height:28px;overflow:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- inputs & buttons ---------- */
label.lbl{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin:0 0 6px;letter-spacing:.01em}
.inp,select.inp,textarea.inp{width:100%;font:inherit;font-size:.9rem;color:var(--text);background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 12px;transition:border-color .2s,box-shadow .2s}
textarea.inp{min-height:76px;resize:vertical;line-height:1.5}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.16)}
.inp::placeholder{color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 16px;border-radius:10px;font-weight:700;font-size:.86rem;border:1px solid transparent;transition:background-color .2s,border-color .2s,transform .15s,opacity .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-gold{background:var(--gold);color:var(--on-gold)}
.btn-gold:hover{background:var(--gold-2)}
.btn-ghost{border-color:var(--line-2);background:var(--panel)}
.btn-ghost:hover{border-color:var(--gold)}
.btn-quiet{color:var(--muted)}
.btn-quiet:hover{color:var(--text);background:var(--panel-2)}
.btn-danger{border-color:rgba(229,100,91,.45);color:var(--danger);background:transparent}
.btn-danger:hover{background:rgba(229,100,91,.1)}
.btn-sm{min-height:32px;padding:0 11px;font-size:.8rem;border-radius:8px}
.btn-icon{width:38px;padding:0}
.btn-sm.btn-icon{width:32px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.02em;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);border-color:rgba(34,197,94,.35)}
.pill.warn{color:var(--warn);border-color:rgba(240,168,42,.4)}
.pill.bad{color:var(--danger);border-color:rgba(229,100,91,.4)}
.pill.gold{color:var(--gold-2);border-color:rgba(var(--gold-rgb),.45)}
.pill.info{color:var(--info);border-color:rgba(90,163,232,.4)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .mono{font-family:var(--mono)}
.kbd{font-family:var(--mono);font-size:.7rem;padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);color:var(--muted);background:var(--panel-2)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(60% 50% at 50% 0%,rgba(var(--gold-rgb),.14),transparent 70%),var(--bg)}
.login-card{width:min(400px,100%);padding:34px 30px 28px;border-radius:20px;background:var(--panel);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.login-brand .mark{width:40px;height:37px}
.brand-word{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;line-height:1}
.brand-word b{color:var(--gold)} .brand-sub{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.login h1{font-family:var(--display);font-size:1.5rem;margin-bottom:4px}
.login p.lead{color:var(--muted);font-size:.9rem;margin-bottom:22px}
.pw-wrap{position:relative}
.pw-wrap .inp{padding-inline-end:44px}
.pw-eye{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);width:36px;height:34px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.login .btn{width:100%;margin-top:14px;min-height:44px}
.login-msg{min-height:1.4em;margin-top:12px;font-size:.84rem;color:var(--danger)}
.login-msg.info{color:var(--muted)}
.login-foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:.78rem;color:var(--faint);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--bg-2);border-inline-end:1px solid var(--line);z-index:60}
.side-top{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.side-top .brand-word{font-size:1.05rem}
.side-nav{flex:1;overflow-y:auto;padding:6px 10px 14px}
.nav-group{margin-top:14px}
.nav-group>span{display:block;padding:0 10px 6px;font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.nav-group{margin-top:6px}
.nav-group.solo{margin-top:4px;margin-bottom:6px}
.nav-gh{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);text-align:start}
.nav-gh:hover{color:var(--muted);background:var(--panel)}
.nav-gh .count{margin-inline-start:auto}
.nav-chev{width:14px;height:14px;margin-inline-start:auto;transform:rotate(90deg);transition:transform .2s}
.nav-gh .count+.nav-chev{margin-inline-start:6px}
.nav-group.closed .nav-chev{transform:none}
[dir="rtl"] .nav-group.closed .nav-chev{transform:rotate(180deg)}
.nav-items{display:flex;flex-direction:column;gap:1px;padding-bottom:4px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:9px;color:var(--muted);font-weight:600;font-size:.88rem;text-align:start;transition:background-color .15s,color .15s}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:rgba(var(--gold-rgb),.12);color:var(--text)}
.nav-item.active .ico{color:var(--gold)}
.nav-item .count{margin-inline-start:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--gold);color:var(--on-gold);font-size:.68rem;font-weight:800;display:grid;place-items:center}
.side-foot{padding:14px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:10px;background:#1c2233;border:1px solid var(--gold);display:grid;place-items:center}
.avatar .mark{width:20px;height:18px;--inner:#fff}
.who b{display:block;font-size:.86rem;line-height:1.2} .who span{font-size:.72rem;color:var(--muted)}
.side-foot .btn{margin-inline-start:auto}
.scrim{display:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:12px clamp(16px,3vw,32px);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-title{font-family:var(--display);font-size:1.12rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{font-size:.76rem;color:var(--faint);display:block;font-family:var(--font);font-weight:600}
.search-btn{margin-inline-start:auto;display:flex;align-items:center;gap:10px;min-width:220px;height:38px;padding:0 10px 0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);color:var(--faint);font-size:.84rem}
.search-btn .kbd{margin-inline-start:auto}
.search-btn:hover{border-color:var(--gold);color:var(--muted)}
.menu-btn{display:none}
.bell{position:relative}
.bell .dot{position:absolute;top:7px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--bg)}
.demo-flag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(90,163,232,.12);color:var(--info);font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.view{padding:clamp(18px,3vw,32px);padding-bottom:120px;max-width:1280px;width:100%}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.view-head h2{font-family:var(--display);font-size:clamp(1.5rem,2.6vw,2rem);letter-spacing:-.02em;line-height:1.15}
.view-head p{color:var(--muted);margin-top:4px;max-width:640px}
.view-head .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h3{font-size:.95rem;font-weight:800}
.card-h .k{font-family:var(--mono);font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.span2{grid-column:span 2}
.stat{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:132px;cursor:pointer;transition:border-color .2s,transform .2s var(--ease)}
.stat:hover{border-color:var(--line-2);transform:translateY(-2px)}
.stat .k{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:var(--muted)}
.stat .k .ico{color:var(--gold)}
.stat .v{font-family:var(--display);font-size:2rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat .s{font-size:.8rem;color:var(--muted);margin-top:auto}
.hello{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;padding:24px 26px;border-radius:18px;border:1px solid var(--line-2);
  background:radial-gradient(80% 140% at 100% 0%,rgba(var(--gold-rgb),.16),transparent 60%),linear-gradient(135deg,#1c2233,#0c0f15);color:#f2f4f8}
.hello h2{font-family:var(--display);font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.02em;line-height:1.15}
.hello p{color:#aab3c5;margin-top:4px}
.hello .mark{width:54px;height:50px;--inner:#fff}
.hello .mark{--mk-o:#f0384e}
.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:22px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:.84rem;text-align:start;transition:border-color .2s,background-color .2s}
.qa:hover{border-color:var(--gold);background:var(--panel-2)}
.qa .ico{color:var(--gold);width:20px;height:20px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-size:.74rem;color:var(--faint);white-space:nowrap}
.act-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);color:var(--muted);flex:none}
.act-ico.ok{color:var(--ok)} .act-ico.warn{color:var(--warn)} .act-ico.bad{color:var(--danger)} .act-ico.gold{color:var(--gold)}
.health{display:flex;flex-direction:column;gap:10px}
.health div{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.86rem}

/* ---------- empty / error / skeleton ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:38px 20px;color:var(--muted)}
.empty .ico{width:34px;height:34px;color:var(--faint);margin-bottom:4px}
.empty b{color:var(--text);font-size:.95rem}
.empty p{max-width:420px;font-size:.86rem}
.empty .btn{margin-top:8px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);font-size:.86rem;margin-bottom:16px}
.alert .ico{margin-top:1px}
.alert.warn{border-color:rgba(240,168,42,.4);background:rgba(240,168,42,.07)} .alert.warn .ico{color:var(--warn)}
.alert.bad{border-color:rgba(229,100,91,.4);background:rgba(229,100,91,.07)} .alert.bad .ico{color:var(--danger)}
.alert.info{border-color:rgba(90,163,232,.35);background:rgba(90,163,232,.07)} .alert.info .ico{color:var(--info)}
.alert b{display:block;margin-bottom:2px}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--panel-2) 25%,var(--panel-3) 50%,var(--panel-2) 75%);background-size:200% 100%;animation:sk 1.3s infinite linear}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- editors ---------- */
.ed-list{display:flex;flex-direction:column;gap:14px}
.ed{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.ed.archived{opacity:.62}
.ed-h{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.ed-h .thumb{width:46px;height:34px;border-radius:7px;object-fit:cover;background:var(--bg-2);border:1px solid var(--line);flex:none}
.ed-h .thumb-ico{width:34px;height:34px;border-radius:9px;background:#fff;padding:5px;object-fit:contain;flex:none}
.ed-h .t{font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-h .tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ed-b{padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ed-b .full{grid-column:1/-1}
.ed.collapsed .ed-b{display:none}
.lang-tabs{display:flex;gap:4px;margin-bottom:8px}
.lang-tab{padding:3px 10px;border-radius:7px;font-size:.72rem;font-weight:800;color:var(--muted);border:1px solid var(--line)}
.lang-tab.on{color:var(--on-gold);background:var(--gold);border-color:var(--gold)}
.lang-tab.has::after{content:'•';margin-inline-start:4px}
.lang-tab.on.has::after{color:var(--on-gold)}
.lang-field{display:none}.lang-field.on{display:block}
.media-pick{display:flex;gap:8px}
.media-pick .inp{flex:1}
.hint{font-size:.76rem;color:var(--faint);margin-top:5px}
.grp{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:12px;overflow:hidden}
.grp>summary{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-weight:800;list-style:none}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .n{margin-inline-start:auto;font-size:.74rem;color:var(--muted);font-weight:600}
.grp>summary .chev{transition:transform .2s;color:var(--muted)}
.grp[open]>summary .chev{transform:rotate(90deg)}
.grp[open]>summary{border-bottom:1px solid var(--line)}
.grp-b{padding:16px;display:flex;flex-direction:column;gap:18px}
.tf-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.tf-head .lbl{margin:0}
.tf-key{font-family:var(--mono);font-size:.68rem;color:var(--faint)}
.tf.changed .lbl::after{content:' • edited';color:var(--gold-2);font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.toolbar .inp{max-width:280px}
.seg{display:inline-flex;padding:3px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);gap:2px;flex-wrap:wrap}
.seg button{padding:5px 11px;border-radius:7px;font-size:.8rem;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--panel-3);color:var(--text)}
.seg button .c{margin-inline-start:5px;font-size:.7rem;color:var(--faint)}

/* ---------- messages ---------- */
.inbox{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px;align-items:start}
.msg-list{max-height:calc(100vh - 250px);overflow-y:auto;padding:6px}
.msg-item{display:block;width:100%;text-align:start;padding:12px;border-radius:10px;border:1px solid transparent}
.msg-item:hover{background:var(--panel-2)}
.msg-item.on{background:rgba(var(--gold-rgb),.10);border-color:rgba(var(--gold-rgb),.35)}
.msg-item .top-l{display:flex;align-items:center;gap:8px}
.msg-item b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
.msg-item.unread b::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-inline-end:7px;vertical-align:.08em}
.msg-item p{font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.msg-item .meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.msg-view h3{font-family:var(--display);font-size:1.35rem}
.msg-body{white-space:pre-wrap;word-break:break-word;padding:16px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);margin:14px 0;font-size:.92rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.84rem}
.kv dt{color:var(--muted)} .kv dd{min-width:0;word-break:break-word}

/* ---------- media ---------- */
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px;border:1.5px dashed var(--line-2);border-radius:var(--r);text-align:center;color:var(--muted);margin-bottom:18px;transition:border-color .2s,background-color .2s}
.drop.over{border-color:var(--gold);background:rgba(var(--gold-rgb),.06)}
.drop .ico{width:28px;height:28px;color:var(--gold)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.mcard .pv{aspect-ratio:4/3;background:var(--bg-2);display:grid;place-items:center}
.mcard .pv img{width:100%;height:100%;object-fit:cover}
.mcard .pv .ico{width:34px;height:34px;color:var(--faint)}
.mcard .mi{padding:10px 12px}
.mcard .mi b{display:block;font-size:.76rem;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mi span{font-size:.72rem;color:var(--muted)}
.mcard .ma{display:flex;gap:4px;margin-top:8px}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:start;font-size:.7rem;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}
.bar{height:8px;border-radius:99px;background:var(--panel-3);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sw{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.sw i{display:block;height:74px}
.sw div{padding:10px 12px;font-size:.8rem}
.sw b{display:block}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.asset{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.asset .pv{height:120px;display:grid;place-items:center;background:var(--bg-2);padding:16px}
.asset .pv.darkbg{background:#07090d}
.asset .pv img{max-height:88px;max-width:100%}
.asset div.n{padding:10px 12px;font-size:.8rem;display:flex;justify-content:space-between;gap:8px;align-items:center}

/* ---------- analytics charts ---------- */
.daychart{display:flex;align-items:flex-end;gap:3px;height:160px;padding-top:6px}
.daychart .dc{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.daychart .dc i{display:block;width:100%;min-height:2px;border-radius:4px 4px 0 0;background:var(--gold)}
.daychart .dc span{font-size:.62rem;color:var(--faint);height:12px}
.daychart.hours{height:120px}

/* ---------- choice dialog ---------- */
.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.choice{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:start;padding:14px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);transition:border-color .2s,background-color .2s}
.choice:hover,.choice:focus-visible{border-color:var(--gold);background:rgba(var(--gold-rgb),.08)}
.choice .ico{width:22px;height:22px;color:var(--gold);margin-top:2px}
.choice b{display:block;font-size:.95rem}
.choice small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px;line-height:1.45}

/* ---------- custom design ---------- */
.part{padding:14px 0;border-top:1px solid var(--line)}
.part:first-of-type{border-top:0;padding-top:4px}
.part-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.part-h b{font-size:.92rem}.part-h .muted{font-size:.8rem}
.part-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.popt{display:flex;flex-direction:column;gap:8px;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--panel);text-align:start;transition:border-color .2s}
.popt:hover{border-color:var(--line-2)}
.popt.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.18)}
.dsp{height:64px;border-radius:8px;background:var(--bg-2);display:grid;place-items:center;overflow:hidden}
.popt-t{font-size:.8rem;font-weight:700}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.swatch.on{border-color:var(--text);box-shadow:0 0 0 2px var(--gold)}

/* ---------- upload progress ---------- */
.up-panel{position:fixed;inset-inline-start:18px;bottom:18px;z-index:120;width:min(360px,calc(100vw - 36px));padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.up-row{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;margin-bottom:8px}
.up-row b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .pv video{width:100%;height:100%;object-fit:cover;background:#000}

/* ---------- lead pipeline ---------- */
.pipeline-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pipe-cell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);text-align:start}
.pipe-cell b{font-family:var(--display);font-size:1.5rem;line-height:1}
.pipe-cell span{font-size:.76rem;color:var(--muted)}
.pipe-cell.has{border-color:rgba(var(--gold-rgb),.45)}
.pipe-cell:hover{border-color:var(--gold)}
@media (max-width:680px){.pipeline-row{grid-template-columns:repeat(3,1fr)}}

/* ---------- design page ---------- */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.preset{position:relative;display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);text-align:start;transition:border-color .2s,transform .2s var(--ease)}
.preset:hover{transform:translateY(-2px);border-color:var(--line-2)}
.preset.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.2)}
.preset .mock{position:relative;height:118px;padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.preset .mock .mk{width:26px;height:24px}
.preset .mock i{display:block;height:6px;border-radius:4px;opacity:.9}
.preset .mock .b{position:absolute;inset-inline-end:14px;bottom:14px;padding:5px 11px;border-radius:7px;font-size:.66rem;font-weight:800}
.preset .mock .lt{position:absolute;inset-inline-end:0;top:0;bottom:0;width:36%;display:flex;flex-direction:column;gap:6px;padding:14px 10px}
.preset .nm{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font-weight:800;font-size:.86rem}
.preset .dots{display:flex;gap:4px}.preset .dots b{width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.3)}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fontc{padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);text-align:start}
.fontc.on{border-color:var(--gold)}
.fontc b{display:block;font-size:1.35rem;line-height:1.15;margin-bottom:4px}
.fontc span{font-size:.8rem;color:var(--muted)}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.86rem;font-weight:600}
.sw-in{position:relative;width:38px;height:22px;flex:none}
.sw-in input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw-in i{position:absolute;inset:0;border-radius:99px;background:var(--panel-3);transition:background-color .2s;pointer-events:none}
.sw-in i::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.sw-in input:checked+i{background:var(--gold)}
.sw-in input:checked+i::after{transform:translateX(16px)}
[dir="rtl"] .sw-in input:checked+i::after{transform:translateX(-16px)}
.sw-in input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
.guide{border-color:rgba(var(--gold-rgb),.45);background:linear-gradient(135deg,rgba(var(--gold-rgb),.10),transparent 60%),var(--panel)}
.guide-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ico.flip{transform:rotate(180deg)}
.custom-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.custom-row input[type=color]{width:46px;height:38px;padding:2px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg-2);cursor:pointer}

/* ---------- action bar (unsaved changes) ---------- */
.savebar{position:fixed;left:calc(var(--side) + 50% - var(--side) / 2);bottom:18px;transform:translate(-50%,140%);z-index:70;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100vw - var(--side) - 32px);padding:10px 10px 10px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--gold);box-shadow:var(--shadow);transition:transform .35s var(--ease)}
.savebar.show{transform:translate(-50%,0)}
.savebar .msg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.86rem;margin-inline-end:6px}
.savebar .msg i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.2)}
.draftnote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;border:1px solid rgba(var(--gold-rgb),.4);background:rgba(var(--gold-rgb),.07);margin-bottom:16px;font-size:.85rem}
.draftnote .acts{margin-inline-start:auto;display:flex;gap:6px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:start center;padding:12vh 16px 16px;background:rgba(3,6,12,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.dialog{width:min(440px,100%);padding:22px;border-radius:16px;background:var(--panel);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.dialog h3{font-family:var(--display);font-size:1.2rem;margin-bottom:6px}
.dialog p{color:var(--muted);font-size:.9rem}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.palette{width:min(620px,100%);border-radius:16px;background:var(--panel);border:1px solid var(--line-2);box-shadow:var(--shadow);overflow:hidden}
.palette .inp{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:1rem;background:transparent}
.palette .inp:focus{box-shadow:none}
.pal-list{max-height:min(420px,56vh);overflow-y:auto;padding:6px}
.pal-sec{padding:10px 12px 4px;font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.pal-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:9px;text-align:start;font-size:.9rem}
.pal-item .ico{color:var(--muted)}
.pal-item small{margin-inline-start:auto;color:var(--faint);font-size:.74rem}
.pal-item.on{background:rgba(var(--gold-rgb),.12)}
.pal-item.on .ico{color:var(--gold)}
.pal-foot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);font-size:.72rem;color:var(--faint)}
.popover{position:fixed;z-index:90;width:min(360px,calc(100vw - 24px));border-radius:14px;background:var(--panel);border:1px solid var(--line-2);box-shadow:var(--shadow);padding:8px}
.popover h4{padding:8px 10px;font-size:.8rem}
.note{display:flex;gap:10px;padding:10px;border-radius:10px;font-size:.84rem;text-align:start;width:100%}
.note:hover{background:var(--panel-2)}
.note .act-ico{width:28px;height:28px}
.note span{color:var(--muted);font-size:.78rem;display:block}
.toasts{position:fixed;inset-inline-end:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 36px))}
.toast{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line-2);border-inline-start:3px solid var(--ok);box-shadow:var(--shadow);font-size:.86rem;font-weight:600;animation:tin .3s var(--ease)}
.toast.err{border-inline-start-color:var(--danger)} .toast.info{border-inline-start-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* ---------- responsive ---------- */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(3,1fr)}}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:min(290px,86vw);transform:translateX(-102%);transition:transform .3s var(--ease);box-shadow:var(--shadow)}
  [dir="rtl"] .side{transform:translateX(102%)}
  .app.drawer .side{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(3,6,12,.55)}
  .menu-btn{display:inline-flex}
  .savebar{left:50%;max-width:calc(100vw - 24px)}
  .g3,.g2{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .inbox{grid-template-columns:1fr}
  .msg-list{max-height:none}
}
@media (max-width:680px){
  body{font-size:14px}
  .search-btn{min-width:0;width:38px;padding:0;justify-content:center}
  .search-btn span,.search-btn .kbd{display:none}
  .g4{grid-template-columns:1fr 1fr}
  .quick{grid-template-columns:repeat(2,1fr)}
  .ed-b{grid-template-columns:1fr}
  .top .hide-sm{display:none}
  .stat{min-height:110px}
  .stat .v{font-size:1.6rem}
  .hello{padding:20px}
  .hello .mark{display:none}
  .savebar{bottom:10px;padding:10px;gap:6px}
  .savebar .msg{width:100%;justify-content:center;margin:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function () {

/* ================= helpers ================= */

function ago(iso) {
  if (!iso) return "—";

  if (s < 45) return "just now";
  const m = Math.round(s / 60); if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + " h ago";
  const d = Math.round(h / 24); if (d < 30) return d + " d ago";

}

// confirm dialog → Promise<boolean>

    document.body.appendChild(ov);

  });
}

function choiceBox(title, text, options) {

    const ov = document.createElement("div");

      '</div><div class="acts"><button class="btn btn-ghost" type="button" data-c="x">Cancel</button></div></div>';
    $("h3", ov).textContent = title; $("p", ov).textContent = text;
    const prev = document.activeElement;
    const done = v => { ov.remove(); document.removeEventListener("keydown", key, true); if (prev && prev.focus) prev.focus(); resolve(v); };
    const key = e => { if (e.key === "Escape") { e.stopPropagation(); done(null); } };
    ov.addEventListener("click", e => { if (e.target === ov) return done(null); const b = e.target.closest("[data-c]"); if (b) done(b.dataset.c === "x" ? null : options[+b.dataset.c].value); });
    document.addEventListener("keydown", key, true);

}

/* ================= state ================= */
const S = {

  delete out.__preview;
  out.overrides = Object.assign({ en: {}, uz: {}, ru: {}, fa: {}, ar: {} }, out.overrides || {});

  ["projects", "team", "certificates", "testimonials", "documents"].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  if (!out.settings || typeof out.settings !== "object") out.settings = {};
  if (!out.settings.contact || typeof out.settings.contact !== "object") out.settings.contact = {};
  if (!out.card || typeof out.card !== "object") out.card = {};

  out.documents.forEach(d => { if (d) delete d.sig; });
  if (out.settings.pricing && (typeof out.settings.pricing !== "object" || !Object.keys(out.settings.pricing).some(k => k === "defect30" || Object.keys(out.settings.pricing.hide || {}).length))) delete out.settings.pricing;

}

/* ================= API (real or local demo) ================= */
async function api(path, opts) {
  if (S.demo) return demoApi(path, opts || {});
  opts = opts || {};
  opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (S.token) opts.headers.Authorization = "Bearer " + S.token;
  let r;
  try { r = await fetch(path, opts); }
  catch (e) { return { ok: false, status: 0, data: { error: "Network error — check your connection." } }; }
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && path !== "/api/login") sessionExpired();
  return { ok: r.ok, status: r.status, data };
}
const get = (action, extra) => api("/api/admin?action=" + action + (extra || ""), { method: "GET" });
const post = (body) => api("/api/admin", { method: "POST", body: JSON.stringify(body) });

/* ---- local demo: lets the panel be reviewed without the Vercel API. Clearly labelled sample data. ---- */
const DEMO = (() => {
  const now = Date.now(), iso = ms => new Date(now - ms).toISOString();
  return {
    content: emptyContent(),
    messages: [
      { id: "demo1", name: "Sample visitor", email: "visitor@example.com", message: "Sample message — this is demo data shown only in local demo mode.", lang: "en", status: "new", priority: "normal", createdAt: iso(36e5 * 2), source: "website", country: "UZ" },
      { id: "demo2", name: "Namuna mijoz", email: "client@example.com", message: "Namuna xabar — faqat demo rejimida ko'rinadi.", lang: "uz", status: "in_progress", priority: "high", createdAt: iso(864e5 * 1.5), source: "website", note: "Demo note" }
    ],
    media: [],
    log: [
      { at: iso(6e4 * 3), action: "security.login", object: "Admin sign-in", actor: "Max" },
      { at: iso(36e5 * 2), action: "message.received", object: "Sample visitor", actor: "Website" }
    ]
  };
})();
async function demoApi(path, opts) {
  await new Promise(r => setTimeout(r, 180));
  const body = opts.body ? JSON.parse(opts.body) : {};
  const ok = data => ({ ok: true, status: 200, data });
  const log = (action, object, detail) => DEMO.log.unshift({ at: new Date().toISOString(), action, object, detail, actor: "Max" });
  if (path.startsWith("/api/content")) return ok(Object.assign(clone(DEMO.draft || DEMO.content), DEMO.draft ? { __preview: "draft" } : {}));
  if (path === "/api/save") {
    if (body.mode === "discard") { DEMO.draft = null; log("draft.discard", "Site content"); return ok({ ok: true }); }
    if (body.mode === "draft") { DEMO.draft = clone(body.content); DEMO.draftAt = new Date().toISOString(); log("draft.save", "Site content", body.summary); return ok({ ok: true }); }
    DEMO.content = clone(body.content); DEMO.draft = null; DEMO.pubAt = new Date().toISOString(); log("content.publish", "Site content", body.summary); return ok({ ok: true, versions: 1 });
  }
  if (path === "/api/upload") {
    const key = "img_demo" + Math.random().toString(36).slice(2, 8) + "." + (body.dataUrl.includes("pdf") ? "pdf" : "png");
    DEMO.media.unshift({ key, url: body.dataUrl, size: Math.round(body.dataUrl.length * .75), uploadedAt: new Date().toISOString() });
    log("media.upload", body.name || key); return ok({ ok: true, url: body.dataUrl, key });
  }

    const q = new URLSearchParams(path.split("?")[1] || ""), a = q.get("action") || body.action;

    if (a === "overview") return ok({ status, storageHealth: { ok: true, ms: 12 }, counts: { messages: DEMO.messages.length, unread: DEMO.messages.filter(m => m.status === "new").length, media: DEMO.media.length }, recentMessages: DEMO.messages.slice(0, 5), activity: DEMO.log.slice(0, 12), draft: DEMO.draft ? { updatedAt: DEMO.draftAt } : null, published: DEMO.pubAt ? { updatedAt: DEMO.pubAt } : null });
    if (a === "status") return ok({ status, storageHealth: { ok: true, ms: 12 } });
    if (a === "messages") return ok({ messages: clone(DEMO.messages) });
    if (a === "log") return ok({ log: clone(DEMO.log) });
    if (a === "media") return ok({ media: clone(DEMO.media) });
    if (a === "versions") return ok({ versions: DEMO.pubAt ? [{ pathname: "cms/published/demo.json", at: DEMO.pubAt, size: JSON.stringify(DEMO.content).length }] : [] });
    if (a === "message.update") { const m = DEMO.messages.find(x => x.id === body.id); ["status", "priority", "note"].forEach(k => { if (body[k] != null) m[k] = body[k]; }); if (body.status) log("message.status", m.name, body.status); return ok({ ok: true, message: clone(m) }); }
    if (a === "message.delete") { DEMO.messages = DEMO.messages.filter(x => x.id !== body.id); log("message.delete", body.name); return ok({ ok: true }); }
    if (a === "media.delete") { DEMO.media = DEMO.media.filter(x => x.key !== body.key); log("media.delete", body.key); return ok({ ok: true }); }
    if (a === "logout") return ok({ ok: true });
    if (a === "leads") return ok({ leads: [] });
    if (a === "analytics") return ok({ days: [], today: new Date().toISOString().slice(0, 10), live: 0, tz: "Asia/Tashkent" });
    if (a === "password.change") { if (String(body.next || "").length < 6) return { ok: false, status: 400, data: { error: "Use at least 6 characters" } }; log("security.password_changed", "Admin password"); return ok({ ok: true, token: "demo", exp: Date.now() + 432e5 }); }
  }
  return { ok: false, status: 404, data: { error: "Not available in demo" } };
}

/* ================= auth ================= */
function showLogin(msg, info) {

function sessionExpired() {
  if (S.demo) return;

  showLogin(dirty() ? "Your session expired. Sign in again — unsaved edits in this tab are kept until you reload." : "Your session expired. Please sign in again.", true);

$("#loginForm").addEventListener("submit", async e => {

  const pw = $("#pw").value, btn = $("#loginBtn"), msg = $("#loginMsg");
  if (!pw) { msg.textContent = "Enter the admin password."; msg.className = "login-msg"; return; }
  btn.disabled = true; msg.textContent = "Signing in…"; msg.className = "login-msg info";
  const r = await api("/api/login", { method: "POST", body: JSON.stringify({ password: pw }) });

    S.token = r.data.token; S.exp = r.data.exp || (Date.now() + 12 * 36e5);

  } else if (r.data && r.data.code === "admin-missing" || r.status === 500) msg.textContent = "Admin is not configured on the server yet (ADMIN_PASSWORD / ADMIN_SECRET).";
  else if (r.status === 429) msg.textContent = "Too many attempts. Wait a minute and try again.";
  else msg.textContent = "Wrong password.";
});
$("#demoBtn").addEventListener("click", () => { S.demo = true; S.exp = Date.now() + 12 * 36e5; start(); });

  const unread = Array.isArray(S.messages) ? S.messages.filter(m => m.status === "new").length : (S.overview && S.overview.counts ? S.overview.counts.unread : 0);
  const badge = k => (k === "messages" ? unread : k === "leads" ? newLeads() : 0);
  const closed = navCollapsed();
  $("#sideNav").innerHTML = NAV.map(g => {
    const items = g.items.map(([k, t, i]) =>

      (badge(k) ? '<span class="count">' + badge(k) + "</span>" : "") + "</button>").join("");
    if (g.solo) return '<div class="nav-group solo">' + items + "</div>";
    const hasActive = g.items.some(([k]) => k === S.view);

    const total = g.items.reduce((n, [k]) => n + badge(k), 0);
    const id = "ng-" + g.g.toLowerCase();
    return '<div class="nav-group' + (open ? "" : " closed") + '"><button type="button" class="nav-gh" data-navg="' + esc(g.g) + '" aria-expanded="' + open + '" aria-controls="' + id + '">' +

// how many separate things differ between two content objects (texts per language, list items, settings)
function countChanges(a, b) {
  a = normalize(a); b = normalize(b);
  let n = 0;
  LANGS.forEach(l => { const x = a.overrides[l] || {}, y = b.overrides[l] || {}; new Set([...Object.keys(x), ...Object.keys(y)]).forEach(k => { if (x[k] !== y[k]) n++; }); });
  ["projects", "team", "certificates", "testimonials", "documents"].forEach(k => { const x = a[k], y = b[k]; for (let i = 0; i < Math.max(x.length, y.length); i++) if (JSON.stringify(x[i]) !== JSON.stringify(y[i])) n++; });
  ["design", "contact", "pricing", "hideBuiltin"].forEach(k => { if (JSON.stringify(a.settings[k] || {}) !== JSON.stringify(b.settings[k] || {})) n++; });
  return n;
}
const pendingChanges = () => (S.published ? countChanges(S.published, S.content) : 0);
function summary() {
  const before = JSON.parse(S.base), now = S.content, parts = [];
  ["projects", "team", "certificates", "testimonials", "documents"].forEach(k => { if (JSON.stringify(before[k] || []) !== JSON.stringify(now[k])) parts.push(k === "team" ? "AI team" : k); });
  let n = 0; LANGS.forEach(l => { const a = before.overrides[l] || {}, b = now.overrides[l] || {}; new Set([...Object.keys(a), ...Object.keys(b)]).forEach(k => { if (a[k] !== b[k]) n++; }); });
  if (n) parts.push(n + " text" + (n > 1 ? "s" : ""));
  if (JSON.stringify((before.settings || {}).design) !== JSON.stringify(now.settings.design)) parts.push("design");
  if (JSON.stringify((before.settings || {}).contact || {}) !== JSON.stringify(now.settings.contact)) parts.push("contact details");
  if (JSON.stringify((before.settings || {}).hideBuiltin || {}) !== JSON.stringify(now.settings.hideBuiltin || {})) parts.push("built-in projects");
  return parts.length ? parts.join(", ") : "No changes";
}
function validate() {
  const problems = [];
  S.content.projects.forEach((p, i) => { if (!p.title) problems.push("Project #" + (i + 1) + " has no title."); if (p.clientPublic && !p.client) problems.push("Project “" + (p.title || i + 1) + "”: enter the client's name or untick “show the client's name”."); if (p.link && !/^https?:\/\/|^\//.test(p.link)) problems.push("Project “" + (p.title || i + 1) + "” link must start with https:// or /."); });
  S.content.team.forEach((m, i) => { if (!m.name) problems.push("AI teammate #" + (i + 1) + " has no name."); });
  S.content.certificates.forEach((c, i) => { if (!c.title || !c.image) problems.push("Certificate #" + (i + 1) + " needs a title and an image."); });
  S.content.testimonials.forEach((r, i) => {
    if (!r.name) problems.push("Testimonial #" + (i + 1) + " has no client name.");
    else if (!r.archived && !r.consent) problems.push("“" + r.name + "” is visible but the client's permission is not ticked — tick it or archive the testimonial.");
    else if (!r.archived && !Object.keys(r.text || {}).length) problems.push("“" + r.name + "” has no review text.");
  });
  S.content.documents.forEach((d, i) => {
    if (!d.project) problems.push("Document #" + (i + 1) + " needs a project name.");
    else if (!d.docNo) problems.push("Document “" + d.project + "” needs a certificate number.");
    if (d.url && !/^https?:\/\//.test(d.url)) problems.push("Document “" + (d.project || i + 1) + "” link must start with https://");
  });
  const ct = S.content.settings.contact || {};
  if (ct.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ct.email)) problems.push("Contact email is not a valid address.");
  return problems;
}
async function saveDraft(silent) {
  const bad = validate();

  const r = await api("/api/save", { method: "POST", body: JSON.stringify({ mode: "draft", content: S.content, summary: summary() }) });
  if (!r.ok) { toast(saveError(r), "err"); return false; }
  S.base = JSON.stringify(S.content); S.hasDraft = true; S.draftAt = new Date().toISOString();
  changed(); if (!silent) toast("Draft saved — not public yet."); refreshDraftNote();
  return true;
}
async function preview() {
  if (dirty() && !(await saveDraft(true))) return;
  if (!S.hasDraft) { toast("Nothing in draft — the preview shows the published site.", "info"); }
  if (S.demo) { toast("Preview needs the deployed site (the local server has no API).", "info"); return; }
  window.open("/?preview=1", "_blank");   // sessionStorage (the admin token) is copied into the new tab
}
async function publish() {
  const bad = validate();
  if (bad.length) { toast(bad[0], "err"); return; }
  const what = dirty() ? summary() : (S.hasDraft ? "the saved draft" : "");
  if (!what) { toast("Nothing to publish.", "info"); return; }
  const n = pendingChanges();
  if (!(await confirmBox("Publish to the live site?", "You are about to publish " + (n ? n + " content change" + (n > 1 ? "s" : "") : "the saved draft") + " (" + what + "). Visitors see it right away; the previous version stays in Settings → Versions.", "Publish " + (n || "")))) return;
  const r = await api("/api/save", { method: "POST", body: JSON.stringify({ mode: "publish", content: S.content, summary: dirty() ? summary() : "Published draft" }) });
  if (!r.ok) { toast(saveError(r), "err"); return; }
  S.base = JSON.stringify(S.content); S.hasDraft = false; S.draftAt = null; S.publishedAt = new Date().toISOString();
  changed(); toast("Published — the live site is updated."); refreshDraftNote();
  S.published = normalize(clone(S.content));
  loadOverview();
}
async function discard() {
  if (!(await confirmBox("Discard changes?", "Unsaved edits in this tab" + (S.hasDraft ? " and the saved draft" : "") + " will be thrown away. The live site is not affected.", "Discard", true))) return;
  if (S.hasDraft) await api("/api/save", { method: "POST", body: JSON.stringify({ mode: "discard", summary: "Discarded draft" }) });
  S.hasDraft = false; S.draftAt = null;
  await loadContent(); go(S.view, { keepScroll: true }); toast("Changes discarded.", "info");
}
function saveError(r) {
  if (r.data && r.data.code === "storage-missing") return "Storage is not connected — connect a Vercel Blob store to this project.";

function langField(opts) {

function pickFile(accept) {

// Files go from the browser straight to Vercel Blob (in parallel parts for big files), so there is
// no practical size limit here — only the storage space of the Vercel Blob plan. /api/blob-upload
// checks the admin session before issuing the one-time upload token.
const UPLOAD_TYPES = /^(image\/(png|jpe?g|webp|gif|avif|svg\+xml)|video\/(mp4|webm|quicktime|x-m4v|ogg)|application\/pdf)$/;
const EXT = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif", "image/avif": "avif", "image/svg+xml": "svg", "video/mp4": "mp4", "video/webm": "webm", "video/quicktime": "mov", "video/x-m4v": "m4v", "video/ogg": "ogv", "application/pdf": "pdf" };
const isVideo = u => /\.(mp4|webm|mov|m4v|ogv)(\?|$)/i.test(String(u || ""));
let blobClient = null;
function upPanel(name) {
  let el = $("#upPanel");
  if (!el) { el = document.createElement("div"); el.id = "upPanel"; el.className = "up-panel"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.innerHTML = '<div class="up-row"><b></b><span>0%</span></div><div class="bar"><i style="width:0%"></i></div>';
  $("b", el).textContent = name;
  return { set: p => { $("span", el).textContent = Math.round(p) + "%"; $("i", el).style.width = p + "%"; }, done: () => setTimeout(() => el.remove(), 800) };
}
async function uploadFile(file) {
  if (!file) return null;
  if (!UPLOAD_TYPES.test(file.type)) { toast("Supported: images (PNG, JPG, WebP, GIF, AVIF, SVG), videos (MP4, WebM, MOV) and PDF.", "err"); return null; }
  const key = "med_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10) + "." + EXT[file.type];
  const ui = upPanel(file.name + " · " + kb(file.size));
  try {
    if (S.demo) throw new Error("demo");
    if (!blobClient) blobClient = await import("https://cdn.jsdelivr.net/npm/@vercel/blob@2.8.0/client/+esm");
    await blobClient.upload("media/" + key, file, {
      access: "private", handleUploadUrl: "/api/blob-upload", contentType: file.type,
      clientPayload: JSON.stringify({ token: S.token }), multipart: file.size > 8 * 1024 * 1024,
      onUploadProgress: p => ui.set(p.percentage)
    });
    ui.set(100); ui.done();
    await post({ action: "media.log", key, name: file.name, size: file.size, type: file.type });
    toast("Uploaded " + file.name + ".");
    S.media = null;
    return { url: "/api/media/" + key, key, size: file.size, contentType: file.type };
  } catch (e) {
    // local preview / demo: small images and PDFs can still use the older upload route
    if (file.size <= MAX_UPLOAD && /^(image|application\/pdf)/.test(file.type)) { ui.done(); return uploadFileLegacy(file); }
    ui.done();
    toast(S.demo ? "Large uploads work on the deployed site." : /401|nauthor/i.test(e.message) ? "Your session expired — sign in again." : "Upload failed: " + (e.message || "network error"), "err");
    return null;
  }
}
async function uploadFileLegacy(file) {
  if (!file) return null;
  if (file.size > MAX_UPLOAD) { toast("“" + file.name + "” is " + kb(file.size) + " — on this local preview the limit is 3 MB. On the live site there is no such limit.", "err"); return null; }
  toast("Uploading " + file.name + "…", "info");
  const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
  const r = await api("/api/upload", { method: "POST", body: JSON.stringify({ dataUrl, name: file.name }) });
  if (!r.ok) { toast(r.data.code === "storage-missing" ? "Storage is not connected." : (r.data.error || "Upload failed."), "err"); return null; }
  toast("Uploaded " + file.name + ".");
  S.media = null;
  return r.data;
}

async function suEditorAction(a) {
  const rec = S.su.rec, f = S.su.form;

  if (a === "preview") { if (S.su.dirty) { const ok = await suAct("save", { draft: f, slug: S.su.slug }, "Draft saved."); if (!ok) return; } if (S.demo) return toast("Preview needs the deployed site.", "info"); window.open("/startups/" + S.su.rec.slug + "?preview=1", "_blank"); return; }
  if (a === "save") return suAct("save", { draft: f, slug: S.su.slug }, rec.visible ? "Draft saved — the live page is unchanged until you publish." : "Draft saved.");
  if (S.su.dirty && !["delete"].includes(a)) { toast("Save the draft first.", "info"); return; }
  if (a === "submit") return suAct("submit", {}, "Submitted for review.");
  if (a === "approve") return suAct("approve", {}, "Approved — ready to publish.");

  if (a === "toDraft") return suAct("toDraft", {}, "Returned to draft.");
  if (a === "publish") { if (!(await confirmBox("Publish to the site?", "Visitors will see this version of “" + f.name + "” right away. The previous version stays in the version list.", "Publish"))) return; return suAct("publish", { confirm: true }, "Published — live in the Startups section."); }
  if (a === "unpublish") { if (!(await confirmBox("Unpublish “" + f.name + "”?", "It disappears from the Startups section on the site. Nothing is deleted.", "Unpublish", true))) return; return suAct("unpublish", { confirm: true }, "Unpublished."); }
  if (a === "archive") { if (!(await confirmBox("Archive “" + f.name + "”?", "It is hidden everywhere public and kept with its history, tasks and files.", "Archive", true))) return; return suAct("archive", { confirm: true }, "Archived."); }
  if (a === "unarchive") return suAct("archive", { confirm: true, archived: false }, "Restored from the archive (not public until you publish).");
  if (a === "delete") {
    const typed = await noteBox("Delete permanently?", "The record and its version history are deleted. Tasks and files stay in the Workspace, unlinked. Type the page address to confirm.", "Delete", { label: rec.slug, danger: true });
    if (typed === null) return;

    if (!r.ok) return toast(r.data.error || "Could not delete.", "err");

  }
}

// PDFs come from the authorised API, never from a public URL
async function vcPdf(action, id, filename, open) {

  let r;

  catch (e) { if (w) w.close(); return toast("Network error.", "err"); }
  if (!r.ok) { if (w) w.close(); const j = await r.json().catch(() => ({})); return toast(j.error || "Could not get the PDF (" + r.status + ").", "err"); }
  if (r.headers.get("X-Integrity") === "MISMATCH") toast("Warning: the stored PDF does not match its recorded SHA-256 digest.", "err");

  setTimeout(() => URL.revokeObjectURL(url), 120000);
}

function vcBindEditor() {

  }));

    const a = b.dataset.vce;

    if (a === "requestInfo") { const note = await noteBox("Request information", "The certificate goes back to draft with your request.", "Send request", { label: "What is missing?", multi: true }); if (!note) return; return vcAct("requestInfo", { note }, "Information requested."); }

    if (a === "reinstate") { const reason = await noteBox("Reinstate " + r.number + "?", "The verification page will show Valid again.", "Reinstate", { label: "Reason (recorded)", multi: true }); if (!reason) return; return vcAct("reinstate", { reason }, "Reinstated."); }
    if (a === "revoke") {

function notifications() {
  const out = [], st = S.status || (S.overview && S.overview.status) || {};
  const unread = Array.isArray(S.messages) ? S.messages.filter(m => m.status === "new").length : (S.overview && S.overview.counts ? S.overview.counts.unread : 0);
  const nl = newLeads();
  if (nl) out.push(["bolt", "gold", nl + " new lead" + (nl > 1 ? "s" : ""), "Reply and move them forward", "leads"]);
  const due = Array.isArray(S.leads) ? S.leads.filter(l => l.followUp && l.followUp <= new Date().toISOString().slice(0, 10) && l.status !== "won" && l.status !== "lost").length : 0;
  if (due) out.push(["bolt", "warn", due + " follow-up" + (due > 1 ? "s" : "") + " due", "Leads with a follow-up date today or earlier", "leads"]);
  if (S.overview && S.overview.lastNotify && S.overview.lastNotify.result === "failed") out.push(["send", "bad", "Last Telegram notification failed", "Open the lead and press Retry", "leads"]);
  if (unread) out.push(["inbox", "gold", unread + " unread message" + (unread > 1 ? "s" : ""), "Open the inbox", "messages"]);
  if (S.hasDraft) out.push(["save", "", "Draft not published", "Saved " + ago(S.draftAt), "dashboard"]);
  if (dirty()) out.push(["alert", "warn", "Unsaved changes in this tab", "Save a draft or publish", null]);
  if (st.storage === false) out.push(["alert", "bad", "Storage is not connected", "Publishing and the inbox need Vercel Blob", "system"]);
  if (st.admin != null && !st.telegram) out.push(["send", "warn", "Telegram is not configured", "Messages only reach the inbox", "system"]);
  if (S.exp && S.exp - Date.now() < 30 * 6e4) out.push(["lock", "warn", "Session ends soon", "Sign in again to keep working", "system"]);
  return out;
}

function openPalette() {
  if ($(".palette")) return;
  const all = paletteItems();
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = '<div class="palette" role="dialog" aria-modal="true" aria-label="Search"><input class="inp" type="search" placeholder="Search pages, actions, messages, texts…" aria-label="Search" aria-controls="palList" aria-autocomplete="list"/><div class="pal-list" id="palList" role="listbox"></div><div class="pal-foot"><span><span class="kbd">↑↓</span> move</span><span><span class="kbd">Enter</span> open</span><span><span class="kbd">Esc</span> close</span></div></div>';
  document.body.appendChild(ov);
  const inp = $("input", ov), listEl = $("#palList", ov);
  let shown = [], idx = 0;
  const prev = document.activeElement;
  const close = () => { ov.remove(); if (prev && prev.focus) prev.focus(); };
  function draw() {
    const q = inp.value.trim().toLowerCase();
    shown = (q ? all.filter(x => (x.t + " " + (x.sub || "") + " " + (x.extra || "") + " " + x.sec).toLowerCase().includes(q)) : all.filter(x => x.sec === "Pages" || x.sec === "Actions")).slice(0, 40);
    idx = Math.min(idx, Math.max(0, shown.length - 1));
    let sec = "", html = "";
    shown.forEach((x, i) => {
      if (x.sec !== sec) { sec = x.sec; html += '<div class="pal-sec">' + esc(sec) + "</div>"; }
      html += '<button type="button" class="pal-item' + (i === idx ? " on" : "") + '" role="option" aria-selected="' + (i === idx) + '" data-pi="' + i + '">' + ico(x.i) + "<span>" + esc(x.t) + "</span>" + (x.sub ? "<small>" + esc(x.sub) + "</small>" : "") + "</button>";
    });
    listEl.innerHTML = html || emptyBox("search", "No results", "Try another word.");
    const on = $(".pal-item.on", listEl); if (on) on.scrollIntoView({ block: "nearest" });
  }
  inp.addEventListener("input", () => { idx = 0; draw(); });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); idx = Math.min(shown.length - 1, idx + 1); draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); idx = Math.max(0, idx - 1); draw(); }
    else if (e.key === "Enter") { e.preventDefault(); const x = shown[idx]; if (x) { close(); x.run(); } }
    else if (e.key === "Escape") { e.preventDefault(); close(); }
  });
  ov.addEventListener("click", e => { if (e.target === ov) return close(); const b = e.target.closest("[data-pi]"); if (b) { const x = shown[+b.dataset.pi]; close(); x.run(); } });
  draw(); inp.focus();
}

  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  $('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#07090d" : "#f5f3ec");
  $("#themeBtn use").setAttribute("href", t === "dark" ? "#i-sun" : "#i-moon");
  try { localStorage.setItem("uz_admin_theme", t); } catch (e) {}
}
$("#themeBtn").addEventListener("click", toggleTheme);
if (document.documentElement.getAttribute("data-theme") === "light") $("#themeBtn use").setAttribute("href", "#i-moon");

/* ================= boot ================= */
if (S.token && (!S.exp || S.exp > Date.now())) start();
else { if (S.token) sessionStorage.removeItem("uz_admin_token"); showLogin(); }
})();
</script>
</body>
</html>
